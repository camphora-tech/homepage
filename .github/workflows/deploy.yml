name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main, preview]

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # preview ブランチでは og:image などの絶対 URL をプレビューのドメインにする
      - name: Build
        run: pnpm build
        env:
          NITRO_PRESET: cloudflare_pages
          NUXT_SITE_URL: ${{ github.ref_name == 'preview' && 'https://preview.homepage-3e2.pages.dev' || 'https://www.camphora.tech' }}

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=homepage-3e2 --branch=${{ github.ref_name }}
